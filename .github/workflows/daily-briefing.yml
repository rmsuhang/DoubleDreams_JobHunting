name: Daily Official Recruitment Briefing

on:
  schedule:
    # UTC 23:17 = 北京时间 07:17，错开 UTC 00:00 全球整点调度拥堵高峰，避免排队 3~6 小时延迟
    - cron: '17 23 * * *'
  workflow_dispatch:
    # 支持在 GitHub Actions 页面随时点击 "Run workflow" 手动立即刷新

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run daily official recruitment scan & generate docs/index.html
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKBENCH_API_URL: ${{ vars.WORKBENCH_API_URL }}
        run: node scripts/daily-update.ts

      - name: Commit updated briefing snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/briefings.json docs/index.html docs/latest.md
          if git diff --staged --quiet; then
            echo "No briefing changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily recruitment briefing ($(TZ=Asia/Shanghai date +'%Y-%m-%d'))"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto latest origin/${{ github.ref_name }} and retrying..."
            git pull --rebase -X theirs origin "${{ github.ref_name }}" || git rebase --abort || true
            sleep 5
          done
          echo "Failed to push updated briefing after 3 attempts."
          exit 1

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'
          name: github-pages

  deploy:
    needs: update-and-publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
